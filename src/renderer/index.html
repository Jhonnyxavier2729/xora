<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Xora</title>
    <style>
      /* Pantalla de carga (como la de Deska): la marca animada y la versión, pintadas antes de que cargue la app.
         --boot-version lo pone el preload a partir de la URL de la ventana; aquí no puede haber <script> en
         línea (la CSP solo admite scripts propios). La app la desvanece cuando ya tiene sus datos. */
      :root {
        --boot-bg: #0b0d12;
        --boot-version: '';
      }
      html,
      body {
        margin: 0;
        background: var(--boot-bg);
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: var(--boot-bg);
        user-select: none;
        transition: opacity 320ms ease, visibility 0s linear 320ms;
      }
      #boot.boot-out {
        opacity: 0;
        visibility: hidden;
      }
      #boot .boot-mark {
        width: 112px;
        height: 112px;
        animation: boot-breathe 1800ms ease-in-out infinite;
        filter: drop-shadow(0 18px 40px rgba(124, 107, 255, 0.22));
      }
      #boot .boot-stroke {
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: boot-draw 1800ms cubic-bezier(0.65, 0, 0.35, 1) infinite both;
      }
      #boot .boot-stroke.b {
        animation-delay: 140ms;
      }
      #boot .boot-spark {
        transform-origin: 32px 32px;
        transform-box: view-box;
        animation: boot-spark 1800ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite both;
      }
      #boot .boot-version {
        height: 16px;
        line-height: 16px;
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-size: 11px;
        letter-spacing: 0.025em;
        color: rgba(230, 235, 245, 0.4);
      }
      #boot .boot-version::after {
        content: var(--boot-version, '');
      }
      /* Los trazos de la X se dibujan, el destello aparece, se sostiene y vuelve a empezar. */
      @keyframes boot-draw {
        0% {
          stroke-dashoffset: 1;
        }
        34%,
        86% {
          stroke-dashoffset: 0;
        }
        100% {
          stroke-dashoffset: -1;
        }
      }
      @keyframes boot-spark {
        0%,
        30% {
          transform: scale(0) rotate(-90deg);
          opacity: 0;
        }
        44%,
        82% {
          transform: scale(1) rotate(0deg);
          opacity: 1;
        }
        96%,
        100% {
          transform: scale(0) rotate(90deg);
          opacity: 0;
        }
      }
      @keyframes boot-breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.03);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-mark,
        #boot .boot-stroke,
        #boot .boot-spark {
          animation: none;
          stroke-dashoffset: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="progressbar" aria-label="Cargando Xora">
      <svg class="boot-mark" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="boot-bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1d2236" />
            <stop offset="1" stop-color="#0b0e17" />
          </linearGradient>
          <linearGradient id="boot-a" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#5ce1e6" />
            <stop offset="1" stop-color="#7c6bff" />
          </linearGradient>
          <linearGradient id="boot-b" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffc36b" />
            <stop offset="1" stop-color="#ff5c8a" />
          </linearGradient>
          <linearGradient id="boot-rim" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity=".22" />
            <stop offset="1" stop-color="#ffffff" stop-opacity=".04" />
          </linearGradient>
        </defs>
        <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#boot-bg)" />
        <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="16.25" fill="none" stroke="url(#boot-rim)" stroke-width="1.5" />
        <path class="boot-stroke a" pathLength="1" d="M19.5 18.5 L44.5 45.5" stroke="url(#boot-a)" stroke-width="8.5" stroke-linecap="round" fill="none" />
        <path class="boot-stroke b" pathLength="1" d="M44.5 18.5 L19.5 45.5" stroke="#0b0e17" stroke-width="12" stroke-linecap="round" opacity=".55" fill="none" />
        <path class="boot-stroke b" pathLength="1" d="M44.5 18.5 L19.5 45.5" stroke="url(#boot-b)" stroke-width="8.5" stroke-linecap="round" fill="none" />
        <path class="boot-spark" d="M32 25.6 L33.7 30.3 L38.4 32 L33.7 33.7 L32 38.4 L30.3 33.7 L25.6 32 L30.3 30.3 Z" fill="#fff" />
      </svg>
      <div class="boot-version"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
